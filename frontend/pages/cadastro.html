<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <script>
        const token = localStorage.getItem('authToken');
        if (token) {
            window.location.href = 'dashboard.html'; // Se já tem token, vai para o painel
        }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - SmartCall</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="login-body">

    <header class="navbar">
        <div class="container">
            <div class="logo-area">
                <a href="index.html" class="logo">SmartCall</a>
                <span class="logo-tagline">powered by InfinityWare</span>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html#sobre">Sobre</a></li>
                    <li><a href="index.html#funcionalidades">Funcionalidades</a></li>
                    <li><a href="#">Contato</a></li>
                </ul>
            </nav>
            <div class="auth-buttons">
                <a href="login.html" class="btn btn-secondary">Login</a>
                <a href="cadastro.html" class="btn btn-primary">Cadastre-se</a>
            </div>
        </div>
    </header>
    
    <div class="login-container">
        <div class="login-card">
            <h2 class="login-title">Crie sua Conta</h2>
            <p class="login-subtitle">Rápido e fácil, vamos começar.</p>
            
            <form id="cadastro-form" novalidate>
                <div class="form-group">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" placeholder="Nome" required>
                    <span class="error-message"></span>
                </div>
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="Seu e-mail" required>
                    <span class="error-message"></span>
                </div>
                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" placeholder="Sua senha" required>
                    <span class="error-message"></span>
                </div>
                <div class="form-group">
                    <label for="confirm-password">Repetir Senha</label>
                    <input type="password" id="confirm-password" placeholder="Repetir senha" required>
                    <span class="error-message"></span>
                </div>
                <button type="submit" class="btn btn-primary btn-full-width">Cadastrar</button>
            </form>

            <div class="login-links">
                <p>Já tem uma conta? <a href="login.html">Faça login</a></p>
            </div>
        </div>
    </div>

</body>
<script type="module" src="../js/cadastro.js"></script>
</html>
