<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - SmartCall</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="login-body">

    <header class="navbar">
        <div class="container">
        <div class="logo-area">
            <a href="index.html" class="logo">SmartCall</a>
            <span class="logo-tagline">powered by InfinityWare</span>
        </div>
            <nav>
                <ul>
                    <li><a href="index.html#sobre">Sobre</a></li>
                    <li><a href="index.html#funcionalidades">Funcionalidades</a></li>
                    <li><a href="#">Contato</a></li>
                </ul>
            </nav>
            <div class="auth-buttons">
                <a href="login.html" class="btn btn-secondary">Login</a>
                <a href="cadastro.html" class="btn btn-primary">Cadastre-se</a>
            </div>
        </div>
    </header>

    <div class="login-container">
        <div class="login-card">
            <h2 class="login-title">Recuperar Senha</h2>
            <p class="login-subtitle">Insira seu email abaixo para recuperar sua conta.</p>
            
            <form id="recover-form">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="Seu e-mail" required>
                </div>
                <button type="submit" class="btn btn-primary btn-full-width">Enviar</button>
            </form>

            <div class="login-links">
                <a href="login.html">Voltar para o Login</a>
            </div>
        </div>
    </div>

</body>
</html>
