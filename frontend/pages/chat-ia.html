<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <script src="../js/auth-guard.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat IA - SmartCall</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="dashboard-body">
    <div id="toast-container"></div>
        <aside class="sidebar">
        <div class="sidebar-header">
    <a class="logo">SmartCall</a>
    <span class="logo-tagline">powered by InfinityWare</span>
</div>
        <nav class="sidebar-nav">
            <ul>
                <li><a href="dashboard.html">Painel de Controle</a></li>
                <li><a href="lista-chamados.html">Chamados</a></li>
                <li><a href="relatorios.html">Relatórios</a></li>
                <li><a href="configuracoes.html">Configurações</a></li>
            </ul>
        </nav>
        <div class="sidebar-footer">
            <a href="#" class="logout-button">
                 <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
                <span>Sair</span>
            </a>
            <div class="user-profile">
                <div class="user-avatar">
                    <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20a6 6 0 0 0-12 0"/><circle cx="12" cy="10" r="4"/><circle cx="12" cy="12" r="10"/></svg>
                </div>
                <div class="user-details">
                <span id="userNameDisplay" class="user-name"></span>
                <span id="userRoleDisplay" class="user-role"></span>
            </div>
            </div>
        </div>
    </aside>

    <main class="main-content chat-layout">
        <header class="main-header">
            <div class="ticket-info">
                <h2>Chat com Assistente Virtual</h2>
            </div>
            <div class="user-info">
                <span id="welcomeUserName"></span>
            </div>
        </header>

        <div class="chat-messages">
            <div class="chat-empty-state">
                <div class="empty-state-logo">Smart<span class="logo-accent">Call</span></div>
                <h2 class="empty-state-title">Como posso te ajudar hoje?</h2>
                <div class="suggestion-chips">
                    <button class="suggestion-chip">Como abrir um chamado?</button>
                    <button class="suggestion-chip">Verificar o status de um ticket</button>
                    <button class="suggestion-chip">Falar com um atendente humano</button>
                </div>
            </div>
        </div>

        <div class="chat-composer">
            <textarea placeholder="Pergunte alguma coisa..."></textarea>
            <button class="btn btn-primary">Enviar</button>
        </div>
    </main>
        <script type="module" src="../js/sidebar.js"></script>
</body>
</html>
